steps:
  # 1. Build Docker image (worker image, stored separately from the API image)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/svet-gra-evine-worker:latest'
      - '-t'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/svet-gra-evine-worker:latest'
      - '.'

  # 2. Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/svet-gra-evine-worker:latest']

  # 3. Deploy to Cloud Run (WORKER ONLY - dedicated instance)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'svet-gra-evine-worker'
      - '--image'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/svet-gra-evine-worker:latest'
      - '--region'
      - 'europe-west3'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--port'
      - '8080'
      - '--update-env-vars'
      - 'APP_REGION=europe-west3,APP_MODE=worker,REDIS_URL=${_REDIS_URL}'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '1'
      - '--timeout'
      - '3600'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--concurrency'
      - '80'


images:
  - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/svet-gra-evine-worker:latest'

options:
  logging: CLOUD_LOGGING_ONLY
