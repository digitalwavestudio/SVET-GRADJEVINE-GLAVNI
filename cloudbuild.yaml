steps:
  # 1. Build Docker image with registry cache
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/svet-gra-evine-api:latest'
      - '-t'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/svet-gra-evine-api:latest'
      - '.'

  # 2. Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/svet-gra-evine-api:latest']

  # 3. Deploy to Cloud Run (API only - workers will be handled by separate worker service)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'svet-gra-evine'
      - '--image'
      - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/svet-gra-evine-api:latest'
      - '--region'
      - 'europe-west3'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--update-env-vars'
      - 'NODE_ENV=production,APP_REGION=europe-west3,APP_MODE=api,GEMINI_API_KEY=${_GEMINI_API_KEY},REDIS_URL=${_REDIS_URL},VITE_GA_MEASUREMENT_ID=G-SVV63518LY,VITE_ALGOLIA_APP_ID=H5ILSXDMMP,VITE_ALGOLIA_SEARCH_KEY=2a0ec2ece844643f93eea7cac8145b00,VITE_ALGOLIA_INDEX_NAME=listings,VITE_EMAILJS_PUBLIC_KEY=,VITE_EMAILJS_SERVICE_ID='
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--concurrency'
      - '40'
      - '--timeout'
      - '300'


images:
  - 'europe-west3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/svet-gra-evine-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
